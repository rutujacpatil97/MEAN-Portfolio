<section class="contact full-screen-section">
  <div class="container">
    <p class="eyebrow">05 — LAST STOP</p>
    <h2 class="contact-heading">
      Let's build something<br /><em>together.</em>
    </h2>

    <div class="contact-layout">
      <div class="qr-card">
        <img [src]="qrCodeUrl()" alt="QR code linking to LinkedIn profile" />
        <small>SCAN FOR LINKEDIN</small>
        <a [href]="profile()?.contact?.linkedin" target="_blank" rel="noopener"
          >Open LinkedIn ↗</a
        >
      </div>

      <div class="contact-form">
        <p class="contact-lead">
          Hiring for an Angular or MEAN role?
          <a [href]="'mailto:' + profile()?.contact?.email">{{
            profile()?.contact?.email
          }}</a>
        </p>
        <input #nameField placeholder="Your name" aria-label="Your name" />
        <input
          #emailField
          type="email"
          placeholder="Your email"
          aria-label="Your email"
        />
        <textarea
          #messageField
          rows="4"
          placeholder="Your message"
          aria-label="Your message"
        ></textarea>
        <button
          class="btn btn-light"
          [disabled]="isSending()"
          (click)="
            sendMessage(nameField.value, emailField.value, messageField.value)
          "
        >
          {{ isSending() ? "Sending…" : "Send message →" }}
        </button>
        <small role="status">{{ statusMessage() }}</small>
      </div>
    </div>
  </div>
</section>
